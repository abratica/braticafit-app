<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="What I eat, and how it makes me feel.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BraticaFit</title>
<meta name="theme-color" content="#F9F9F8">
<script>try { var t = localStorage.getItem("bf-theme"); if (t === "gym") { document.querySelector('meta[name="theme-color"]').content = "#0d0d0d"; } else { document.documentElement.dataset.theme = "clarity"; document.addEventListener("DOMContentLoaded", function () { var m = document.querySelector(".wordmark"); if (m) m.src = "icons/wordmark-clarity.webp"; }); } } catch (e) {}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192-bf.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-bf.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=36">
</head>
<body>
<header class="top">
  <h1 class="brand"><img class="wordmark" src="icons/wordmark.webp" alt="BraticaFit" width="146" height="56"></h1>
  <div class="top-end">
    <p id="sub" class="sub"></p>
    <button id="settings" class="icon-btn" aria-label="Settings" hidden>
      <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.9"/><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
</header>

<main id="app">
  <p class="empty">Loading…</p>
</main>

<nav id="tabs" class="bottom-nav" hidden>
  <button data-tab="today" aria-label="Today">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg><span>Today</span>
  </button>
  <button data-tab="train" aria-label="Train">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg><span>Train</span>
  </button>
  <button data-tab="food" aria-label="Food">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4v7a3 3 0 0 0 3 3v6M8 4v6M11 4v7a3 3 0 0 1-3 3M17 20V4c-2 1-3 3.5-3 7h3"/></svg><span>Food</span>
  </button>
  <button data-tab="progress" aria-label="Progress">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16M7 16v-5M12 16V7M17 16v-8"/></svg><span>Progress</span><i class="dot" hidden></i>
  </button>
  <button data-tab="coach" aria-label="Coach">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 18.5V6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H8z"/><path d="M9 9h6M9 12h4"/></svg><span>Coach</span><i class="dot" hidden></i>
  </button>
</nav>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-bg" data-close></div>
  <div class="sheet-card" role="dialog" aria-modal="true">
    <button class="sheet-x" data-close aria-label="Close">×</button>
    <div id="sheet-body"></div>
  </div>
</div>

<input id="camera" type="file" accept="image/*" capture="environment" hidden>
<input id="gallery" type="file" accept="image/*" hidden>
<div id="toast" class="toast" hidden></div>

<script type="module" src="app.js?v=45"></script>
</body>
</html>
