<!doctype html><html><head><meta name="color-scheme" content="light only"><meta name="supported-color-schemes" content="light"></head><body style="margin:0;padding:0;background:#F9F9F8">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F9F9F8"><tr><td align="center" style="padding:36px 16px">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px">
    <tr><td style="padding:0 0 24px"><img src="https://abratica.github.io/braticafit-app/icons/wordmark-email-clarity.png" width="200" alt="BraticaFit" style="display:block;width:200px;height:auto;border:0"></td></tr>
    <tr><td style="background:#FFFFFF;border:1px solid #E8E8E4;border-radius:16px;padding:30px 28px 10px">

      <p style="margin:0 0 18px;font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#6B6B66">On a computer? You can <a href="{{ .ConfirmationURL }}" style="color:#2563EB">sign in with this link</a> instead.</p>
      <p style="margin:0 0 18px;font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#6B6B66">Didn't ask for this? You can ignore it.</p>
    </td></tr>
  </table>
</td></tr></table></body></html>
