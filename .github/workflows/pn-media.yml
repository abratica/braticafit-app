name: Fill in PN video lengths and thumbnails

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/pn-media.mjs
      - name: Save and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898209+github-actions[bot]@users.noreply.github.com"
          git add data/pn-media.json
          git diff --cached --quiet && exit 0
          git commit -m "PN video lengths and thumbnails"
          git push
          gh workflow run pages.yml --ref main
