name: Deploy backend (Supabase)

on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/deploy-supabase.yml"]
  workflow_dispatch:

concurrency: supabase-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Apply database migrations
        run: supabase db push --linked --include-all --yes

      - name: Deploy functions
        run: |
          supabase functions deploy api  --project-ref "$PROJECT_REF" --no-verify-jwt --use-api --yes
          supabase functions deploy jobs --project-ref "$PROJECT_REF" --no-verify-jwt --use-api --yes

      - name: Configure sign-in redirect URL
        run: |
          cat > auth.json <<JSON
          {
            "site_url": "https://abratica.github.io/braticafit-app/",
            "uri_allow_list": "https://abratica.github.io/braticafit-app/**",
            "mailer_otp_exp": 86400
          }
          JSON
          CODE=$(curl -sS -X PATCH \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            --data @auth.json -o resp.txt -w "%{http_code}")
          echo "auth config: HTTP $CODE"
          if [ "$CODE" -ge 300 ]; then cat resp.txt; exit 1; fi

      - name: Connect email (Resend) when the key is set
        run: |
          if [ -z "$RESEND_API_KEY" ]; then echo "RESEND_API_KEY not set yet; skipping email setup"; exit 0; fi
          supabase secrets set --project-ref "$PROJECT_REF" --yes RESEND_API_KEY="$RESEND_API_KEY"
          jq -n --arg pass "$RESEND_API_KEY" --rawfile tpl supabase/templates/signin.html '{
            smtp_admin_email: "andrew@braticafit.com",
            smtp_sender_name: "Andrew from BraticaFit",
            smtp_host: "smtp.resend.com",
            smtp_port: "465",
            smtp_user: "resend",
            smtp_pass: $pass,
            rate_limit_email_sent: 60,
            mailer_subjects_magic_link: "Your BraticaFit sign-in link",
            mailer_templates_magic_link_content: $tpl,
            mailer_subjects_confirmation: "Your BraticaFit sign-in link",
            mailer_templates_confirmation_content: $tpl
          }' > email.json
          CODE=$(curl -sS -X PATCH \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            --data @email.json -o resp.txt -w "%{http_code}")
          rm -f email.json
          echo "email config: HTTP $CODE"
          if [ "$CODE" -ge 300 ]; then cat resp.txt; exit 1; fi

      - name: Connect USDA food database when the key is set
        run: |
          if [ -z "$USDA_API_KEY" ]; then echo "USDA_API_KEY not set in GitHub; leaving Supabase as is"; exit 0; fi
          supabase secrets set --project-ref "$PROJECT_REF" --yes USDA_API_KEY="$USDA_API_KEY"
