name: Check Groq (voice transcripts + video suggestions)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng >/dev/null
      - run: espeak-ng -s 150 -w check.wav "Hey, lower body went okay, but my left knee felt kind of off on the split squats, like it was caving in."
      - run: deno run --allow-net --allow-env --allow-read scripts/groq-check.ts check.wav
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
